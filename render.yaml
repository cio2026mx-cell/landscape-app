services:
  - type: web
    name: landscape-backend
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: build,runtime
      - key: JWT_SECRET
        scope: build,runtime
      - key: VITE_APP_ID
        scope: build,runtime
      - key: OAUTH_SERVER_URL
        scope: build,runtime
      - key: OWNER_OPEN_ID
        scope: build,runtime
      - key: OWNER_NAME
        scope: build,runtime
      - key: BUILT_IN_FORGE_API_URL
        scope: build,runtime
      - key: BUILT_IN_FORGE_API_KEY
        scope: build,runtime
